[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varek-guardrails"
version = "1.3.0"
description = "Python guardrails for autonomous AI agents: a seccomp-BPF subprocess sandbox (namespaces, cgroup limits) and PEP 578 audit-hook telemetry. The VAREK Warden, the seccomp user-notify supervisor, is the C runtime in varek/v1_4 and is not part of this package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kenneth Wayne Douglas, MD" },
]
keywords = [
    "ai-safety",
    "agent-security",
    "sandbox",
    "seccomp",
    "containment",
    "runtime-verification",
    "llm-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://varek-lang.org"
Repository = "https://github.com/kwdoug63/varek"
Changelog = "https://github.com/kwdoug63/varek/blob/main/CHANGELOG.md"
Issues = "https://github.com/kwdoug63/varek/issues"

[tool.setuptools]
# v1.21.0: seccomp_bridge removed; that module was never in the repository
# (listed since package version 1.3.0).
py-modules = ["sandbox", "varek_warden"]

[tool.setuptools.packages.find]
include = ["varek_guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
