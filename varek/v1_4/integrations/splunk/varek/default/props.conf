# SPDX-License-Identifier: MIT
# The OCSF 1.9.0 events varek export --format splunk sends to the HTTP Event
# Collector: one JSON object each, its time the decision's (set by the
# sender, not parsed). The OCSF fields keep their names (file.path,
# dst_endpoint.ip, disposition, ...); the VAREK ones get short names here.
[varek:ocsf]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
category = Structured
description = VAREK Warden decisions as OCSF 1.9.0 events
# indexed by the sender (varek_run, varek_decision, ocsf_class_uid); ASNEW
# names them for events that came another way
FIELDALIAS-varek_indexed = metadata.correlation_uid ASNEW varek_run unmapped.varek.decision_final ASNEW varek_decision
FIELDALIAS-varek = unmapped.varek.decision AS varek_verdict unmapped.varek.rule AS varek_rule unmapped.varek.policy_line AS varek_policy_line policy.desc AS varek_policy_text policy.name AS varek_policy_name policy.uid AS varek_policy_sha256 unmapped.varek.report_id AS varek_report_id unmapped.varek.seq AS varek_seq unmapped.varek.event AS varek_event unmapped.varek.mode AS varek_mode ai_agent.name AS varek_agent ai_agent.type AS varek_agent_type unmapped.varek.audit.passed AS varek_audit_passed
# v1.42: approvals and deferrals (step_up, step_up_end, grant, defer, defer_end, notify)
FIELDALIAS-varek_approvals = unmapped.varek.step_up AS varek_step_up unmapped.varek.defer AS varek_defer unmapped.varek.grant AS varek_grant unmapped.varek.ending AS varek_ending unmapped.varek.state AS varek_state unmapped.varek.approvers AS varek_approvers
# what the decision was about: a file, a process, an endpoint, an MCP call, a URL,
# or (v1.42) the call an approval or a deferral is about
EVAL-varek_target = coalesce('file.path', 'process.file.path', 'process.cmd_line', 'http_request.url.url_string', 'api.operation', 'query.hostname', 'unmapped.varek.object', if(isnotnull('dst_endpoint.port'), coalesce('dst_endpoint.hostname', 'dst_endpoint.ip').":".'dst_endpoint.port', coalesce('dst_endpoint.hostname', 'dst_endpoint.ip')))
# a policy line, or the rule that decided without one (the default deny)
EVAL-varek_decided_by = if(tonumber('unmapped.varek.policy_line') > 0, "line ".'unmapped.varek.policy_line'.": ".coalesce('policy.desc', ""), 'unmapped.varek.rule')
