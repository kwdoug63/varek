# The events the dashboard reads: change the index here if the HEC token
# writes elsewhere (Settings > Advanced search > Search macros).
[varek_events]
definition = index=varek sourcetype="varek:ocsf"
iseval = 0

# a refusal: denied and not let through by a dry run (which records what it
# would refuse, its disposition Detected, not Blocked)
[varek_refused]
definition = varek_decision=DENY NOT varek_mode=dry_run
iseval = 0
