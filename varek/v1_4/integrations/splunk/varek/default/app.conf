# VAREK for Splunk (v1.39, docs/security/v1.39-security-operations.md, section 2)
[install]
# nothing to set up: the HEC token and index are Splunk's own settings
is_configured = false

[id]
name = varek
version = 1.39.0

[package]
id = varek
check_for_updates = false

[ui]
is_visible = true
label = VAREK

[launcher]
author = VAREK
description = The VAREK Warden's decisions as OCSF 1.9.0 events (sourcetype varek:ocsf), sent by varek export --format splunk: field names and an overview of refusals by policy line, agent and run, dry runs and failed audits.
version = 1.39.0
