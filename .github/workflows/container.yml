name: Container image

# v1.32 (step 5 of docs/security/v1.32-containers.md): VAREK's container
# image built on every change, and the suites run inside it under the
# documented settings (packaging/container/README.md): --cap-drop ALL and the
# ten capabilities, --cgroupns=private, Docker's default seccomp profile, and
# VAREK's AppArmor profile (the runner is Ubuntu, with AppArmor). The runtime
# image is checked with `varek doctor` and a run of an agent; the test image
# runs every suite (tests/container_sweep.sh), its logs kept as an artifact.

on:
  push:
    branches: [main]
    paths:
      - "varek/**"
      - "v1_6/**"
      - "v1_7/**"
      - "packaging/container/**"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/container.yml"
      - ".github/workflows/container-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "varek/**"
      - "v1_6/**"
      - "v1_7/**"
      - "packaging/container/**"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/container.yml"
      - ".github/workflows/container-release.yml"

permissions:
  contents: read

jobs:
  image:
    name: Build the image and run the suites in it
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SETTINGS: >-
        --cap-drop ALL --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add SETPCAP
        --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add KILL
        --cap-add NET_ADMIN --cap-add NET_BIND_SERVICE --cap-add CHOWN
        --cgroupns=private --security-opt apparmor=varek-container
    steps:
      - uses: actions/checkout@v4
      - name: The host
        run: |
          uname -srm; docker --version
          echo "cgroup: $(stat -fc %T /sys/fs/cgroup)  AppArmor: $(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo absent)"
      - name: Load VAREK's AppArmor profile
        run: |
          sudo install -m 644 packaging/container/apparmor/varek-container /etc/apparmor.d/varek-container
          sudo apparmor_parser -r -W /etc/apparmor.d/varek-container
      - name: Build the runtime image
        run: docker build -f packaging/container/Containerfile --target runtime -t varek .
      - name: The runtime image - varek doctor finds every setting
        run: |
          # shellcheck disable=SC2086  # $SETTINGS: the docker flags, split into words
          docker run --rm $SETTINGS --entrypoint varek varek doctor | tee doctor.txt || true
          sed -n '/In a container/,/^$/p' doctor.txt > container.txt
          grep -q 'In a container' container.txt
          if grep -q 'FAIL' container.txt; then echo "varek doctor found a setting missing"; exit 1; fi
      - name: The runtime image - an agent runs under the baseline
        run: |
          mkdir -p proj && chmod 755 proj
          # shellcheck disable=SC2086  # $SETTINGS: the docker flags, split into words
          out="$(docker run --rm $SETTINGS -v "$PWD/proj:/work" varek /bin/echo ran-under-the-warden)"
          echo "$out"
          grep -qx ran-under-the-warden <<<"$out"
      - name: The runtime image - Docker's defaults are refused before the agent starts
        run: |
          if docker run --rm -v "$PWD/proj:/work" varek /bin/true 2> refused.txt; then
            echo "the run started under Docker's defaults"; exit 1
          fi
          cat refused.txt
          grep -q 'this container cannot carry the run' refused.txt
      - name: The runtime image - an agent's image built on it (packaging/container/example)
        run: |
          docker build --build-arg VAREK_IMAGE=varek -t varek-example packaging/container/example
          # shellcheck disable=SC2086  # $SETTINGS: the docker flags, split into words
          out="$(docker run --rm $SETTINGS varek-example)"
          echo "$out"
          python3 -c 'import json,sys; r = json.loads(sys.argv[1].splitlines()[-1]); ok = r["read_own_file"] == "ok" and r["import_requests"] == "ok" and r["read_shadow"] != "ok" and r["write_etc"] != "ok" and r["user"] != 0; sys.exit(0 if ok else 1)' "$out"
      - name: Build the node image (v1.34, the Helm chart's)
        run: docker build -f packaging/container/Containerfile --target node -t varek-node .
      - name: The node image - each command the chart names runs, the launcher static
        run: packaging/container/node_check.sh varek-node
      - name: Install preflight (pinned, Red Hat's 1.22.0 release binary, checked by its SHA-256)
        # Red Hat accepts results only from recent preflight (1.19.0 to 1.22.0
        # on November 1, 2026; 1.14.1 is refused), so CI runs the version the
        # submissions use. Releases after 1.14.1 have no Go module version
        # (their tags carry no "v"), so this is the release's own binary, its
        # hash the one the 1.36.1 submissions were made with.
        env:
          PREFLIGHT_VERSION: "1.22.0"
          PREFLIGHT_SHA256: 1451ed8763f209f4d4a63848d9d62d1d40653a247db43d7606feb28eadbbd99b
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "the pinned hash is preflight-linux-amd64's; this runner is $(uname -m)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/preflight" \
            "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/$PREFLIGHT_VERSION/preflight-linux-amd64"
          echo "$PREFLIGHT_SHA256  $RUNNER_TEMP/bin/preflight" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/preflight"
          "$RUNNER_TEMP/bin/preflight" --version | grep -q "^preflight version $PREFLIGHT_VERSION " ||
            { "$RUNNER_TEMP/bin/preflight" --version; echo "not preflight $PREFLIGHT_VERSION"; exit 1; }
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Red Hat's container certification checks (preflight) on the runtime and node images
        run: OUT="$RUNNER_TEMP/preflight" packaging/container/preflight_check.sh varek varek-node
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight
          path: ${{ runner.temp }}/preflight
          if-no-files-found: ignore
      - name: Build the test image
        run: docker build -f packaging/container/Containerfile --target test -t varek-test .
      - name: Run every suite in the test image
        run: sudo varek/v1_4/tests/container_sweep.sh --runtime docker --image varek-test --apparmor --out "$RUNNER_TEMP/sweep"
      - name: Keep the sweep's logs
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/sweep" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-sweep
          path: ${{ runner.temp }}/sweep
          if-no-files-found: ignore
