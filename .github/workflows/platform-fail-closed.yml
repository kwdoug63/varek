name: Platform Fail-Closed Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v1.34 review: the token reads only
permissions:
  contents: read

jobs:
  non-linux-fails-closed:
    name: Verify non-Linux raises IsolationError
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install --require-hashes -r .github/requirements/pytest.txt
      - name: Run platform-gating tests
        run: pytest tests/test_platform_gating.py::TestPlatformGating -v

  linux-platform-check-passes:
    name: Verify Linux platform check does not over-block
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install --require-hashes -r .github/requirements/pytest.txt
      - name: Run Linux behavior test
        run: pytest tests/test_platform_gating.py::TestLinuxBehavior -v