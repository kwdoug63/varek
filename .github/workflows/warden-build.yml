name: Warden build

# v1.16.1: the Warden (varek/v1_4) needs the libseccomp and libsodium
# development headers. This builds it and its tools with exactly those
# packages, lints the shipped policies, and runs the preflight check on each
# (no root: the dependency, build, policy and verdict-stream checks).
# v1.16.3: it also builds and tests v1_6/plan_verify, the Verdict Service's
# plan checker, with the v1.6 unit tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build the Warden with libseccomp + libsodium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libseccomp-dev libsodium-dev
      - name: Build the Warden and its tools
        run: make -C varek/v1_4 all
      - name: Check the deployment scripts parse
        run: |
          python3 -m py_compile varek/v1_4/tools/varek_anchor_forward.py varek/v1_4/tools/varek_audit.py
          bash -n varek/v1_4/tools/varek_preflight.sh
          bash -n varek/v1_4/tools/varek_anchor_receiver.sh
      - name: Lint the shipped policies
        run: |
          for p in varek/v1_4/policy.txt varek/v1_4/conformance_policy.txt varek/v1_4/policies/*.txt; do
            varek/v1_4/tools/vdp_check "$p" lint
          done
      - name: Preflight the shipped policies (verdict stream in /var/log/varek/)
        run: |
          sudo mkdir -p /var/log/varek
          for p in varek/v1_4/policy.txt varek/v1_4/conformance_policy.txt varek/v1_4/policies/*.txt; do
            varek/v1_4/tools/varek_preflight.sh "$p" --log /var/log/varek/verdicts.log
          done
      - name: Build and test the plan_verify CLI (v1_6, v1.16.3)
        run: make -C v1_6 plan_verify check check-plan-verify
