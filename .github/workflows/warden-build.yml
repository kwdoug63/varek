name: Warden build

# v1.16.1: the Warden (varek/v1_4) needs the libseccomp and libsodium
# development headers. This builds it and its tools with exactly those
# packages, lints the shipped policies, and runs the preflight check on each
# (no root: the dependency, build, policy and verdict-stream checks).
# v1.16.3: it also builds and tests v1_6/plan_verify, the Verdict Service's
# plan checker, with the v1.6 unit tests.
# v1.18.0: the v1.7 layer's tests (data flow, breaker, progress safety, URL
# host matching), the Python suites, and the exporter's output against the
# CycloneDX 1.6 schema.
# v1.24.0: the host-name grammar and the resolution table (make test-v1240).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build the Warden with libseccomp + libsodium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libseccomp-dev libsodium-dev libssl-dev
          # v1.24: test_v1240.sh runs a Java client as the agent, with the
          # distribution's OpenJDK (the runner's preinstalled JDKs differ)
          sudo apt-get install -y openjdk-21-jdk-headless musl-tools
          # v1.26 section 5: test_v1260.sh chains the proxy to a Squid upstream
          sudo apt-get install -y --no-install-recommends squid
      - name: Build the Warden and its tools
        run: make -C varek/v1_4 all
      - name: Check the deployment scripts parse
        run: |
          python3 -m py_compile varek/v1_4/tools/varek_anchor_forward.py varek/v1_4/tools/varek_audit.py varek/v1_4/tools/varek_cyclonedx.py varek/v1_4/tools/varek_bench.py
          bash -n varek/v1_4/tools/varek_preflight.sh
          bash -n varek/v1_4/tools/varek_anchor_receiver.sh
      - name: Lint the shipped policies
        run: |
          for p in varek/v1_4/policy.txt varek/v1_4/conformance_policy.txt varek/v1_4/policies/*.txt; do
            varek/v1_4/tools/vdp_check "$p" lint
          done
      - name: Preflight the shipped policies (verdict stream in /var/log/varek/)
        run: |
          sudo mkdir -p /var/log/varek
          for p in varek/v1_4/policy.txt varek/v1_4/conformance_policy.txt varek/v1_4/policies/*.txt; do
            varek/v1_4/tools/varek_preflight.sh "$p" --log /var/log/varek/verdicts.log
          done
      - name: v1.24 host names (grammar, resolution table, the Warden as root)
        run: sudo make -C varek/v1_4 test-v1240
      - name: v1.25 wildcard host names (grammar, shared-domain refusals)
        run: sudo make -C varek/v1_4 test-v1250
      - name: v1.26 the proxy's parsers under ASan/UBSan (vectors, then 2M fuzzed inputs)
        run: make -C varek/v1_4 fuzz-proxy-parse
      - name: v1.26 egress proxy (grammar, proxy process, synthetic addresses, hand-off, parsers, decisions, closes, audit, upstream)
        run: sudo make -C varek/v1_4 test-v1260
      - name: v1.26.1 inspecting mode (grammar, warden-proxy, the run's CA, terminating TLS, request decisions, audit and tools, review fixes, bench)
        run: sudo make -C varek/v1_4 test-v1261
      - name: Build and test the plan_verify CLI (v1_6, v1.16.3)
        run: make -C v1_6 plan_verify check check-plan-verify
      - name: Test the v1.7 layer (v1.18.0)
        run: make -C v1_7 check
      - name: Python suites and CycloneDX schema (v1.18.0)
        run: |
          python3 -m pip install --break-system-packages -r varek/v1_4/tools/requirements-test.txt pytest pyyaml
          python3 -m pytest -q tests
          python3 -m pytest -q varek/v1_4/tests/test_varek_bench.py   # varek bench: the parts that need no root
          mkdir -p /tmp/ci_data /tmp/ci_key
          printf 'allow path /tmp/ci_data/\n' > /tmp/ci_policy.txt
          varek/v1_4/tools/varek_keygen /tmp/ci_key/log.key
          sudo varek/v1_4/warden /tmp/ci_policy.txt --sign-key /tmp/ci_key/log.key -- /bin/true 2> /tmp/ci_run.log || true
          python3 varek/v1_4/tools/varek_cyclonedx.py --log /tmp/ci_run.log --policy /tmp/ci_policy.txt --output /tmp/ci_bom.json
          python3 varek/v1_4/tools/varek_cyclonedx.py --log /tmp/ci_run.log --policy /tmp/ci_policy.txt \
            --pubkey /tmp/ci_key/log.key.pub --sign-key /tmp/ci_key/log.key --output /tmp/ci_signed.json
          python3 varek/v1_4/tools/varek_cyclonedx.py --verify /tmp/ci_signed.json --pubkey /tmp/ci_key/log.key.pub
          python3 varek/v1_4/tests/cdx_schema_check.py /tmp/ci_bom.json /tmp/ci_signed.json
