name: Container release

# v1.32 (step 6 of docs/security/v1.32-containers.md, D7 and D8): on a release
# tag (vX.Y.Z) on main, VAREK's runtime image is built, checked as CI checks it
# (container.yml), and published to the GitHub Container Registry as
# ghcr.io/kwdoug63/varek:<version>. It is signed with cosign, keyless (the
# workflow's own GitHub identity, recorded in Sigstore's transparency log),
# and its software bill of materials (CycloneDX, by syft) is attached as a
# signed attestation; both are verified. Only then, for a release that is not
# a pre-release, are :<major.minor> and :latest moved to it, each only when
# it is the highest release of its kind. No key or password is kept
# anywhere: the registry login is the workflow's own token.
#
# Every action is pinned by its commit, and cosign and syft by version: the
# job holds the token that publishes and the identity that signs.
#
# The version is pushed before it is signed (cosign signs a digest in the
# registry). If signing, the attestation or the verification fails, the
# version's tag is there unsigned, which `cosign verify` refuses, and
# :<major.minor> and :latest have not moved; re-running the job builds,
# signs and verifies a new digest, and the tag moves to it.
#
# v1.34 (step 6 of docs/security/v1.34-kubernetes.md): the node image (the
# Containerfile's node target, what the Helm chart runs) is built, checked
# (packaging/container/node_check.sh), published as
# ghcr.io/kwdoug63/varek-node:<version>, signed and attested the same way;
# then the chart (packaging/helm/varek), its image pinned by the digest just
# signed, is packaged and published as oci://ghcr.io/kwdoug63/charts/varek,
# version <version>, and signed. The chart's version must be the tag's.
#
# v1.36 step 3 (docs/security/v1.36-kubernetes-parity.md, D8): the node
# image for amd64 and arm64, each built and checked natively (arm64 on
# GitHub's arm64 runner, node-arm64 below, before anything is published
# here), each pushed as :<version>-<arch>, then published as one image for
# both, :<version>. The image for both and each architecture's are signed
# (cosign --recursive); each architecture's bill of materials is attested
# on its own image. The chart pins the image for both.
#
# v1.36 step 11: nothing is built for publishing until the matrix passes on
# the tag's commit: every cell of matrix.yml (CRI-O and containerd, amd64
# and arm64) and of matrix-vm.yml (SELinux enforcing, the RHEL 9 and Amazon
# Linux 2023 hosts), each run here as a called workflow. A red cell, and the
# tag publishes no image, chart or signature; re-run the failed jobs once
# fixed, or tag the fix.
#
# v1.36 step 11 (review): node-arm64 signs its image as soon as it pushes
# it, as publish signs amd64's, so :<version>-arm64 is not left unsigned
# while publish runs (or when it fails); publish's --recursive signs it again.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  # v1.36 step 11: the ship gate's matrix, on the tag's commit
  matrix:
    name: Matrix
    permissions:
      contents: read
    uses: ./.github/workflows/matrix.yml
  matrix-vm:
    name: Matrix in VMs
    permissions:
      contents: read
    uses: ./.github/workflows/matrix-vm.yml

  # v1.36: the node image for arm64, built and checked on the arm64 runner,
  # pushed as :<version>-arm64 and signed; publish joins it to amd64's
  node-arm64:
    name: Build, check, push and sign the node image for arm64
    needs: [matrix, matrix-vm]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless: the workflow's OIDC identity
    env:
      NODE: ghcr.io/${{ github.repository_owner }}/varek-node
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: The version, from the tag (a release tag, on main)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="${REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a release tag: $REF_NAME"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag's commit is not on main: $GITHUB_SHA"; exit 1
          fi
          { echo "VERSION=$v"; echo "RELEASE=${v%%-*}"; } >> "$GITHUB_ENV"
      - name: The host
        run: uname -srm; docker --version
      - name: Build the node image
        run: |
          docker build -f packaging/container/Containerfile --target node \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --build-arg VAREK_VERSION="$VERSION" --build-arg VAREK_REVISION="$GITHUB_SHA" \
            -t "$NODE:$VERSION-arm64" .
      - name: Check it before publishing - each command the chart names runs, the launcher static, the Warden the tag's version
        run: |
          packaging/container/node_check.sh "$NODE:$VERSION-arm64"
          docker run --rm "$NODE:$VERSION-arm64" varek version > node-version.txt
          cat node-version.txt
          grep -qE "^VAREK Warden  ${RELEASE//./\\.}  " node-version.txt
          [ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$NODE:$VERSION-arm64")" = linux/arm64 ]
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: Log in to the GitHub Container Registry (the workflow's own token)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push it and sign it (cosign, keyless; publish signs it again, with amd64's)
        id: push
        run: |
          docker push "$NODE:$VERSION-arm64"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$NODE:$VERSION-arm64")"
          [[ "$digest" == "$NODE@sha256:"* ]] || { echo "no digest for $NODE:$VERSION-arm64: $digest"; exit 1; }
          cosign sign --yes "$digest"
          echo "pushed and signed $digest as $VERSION-arm64"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, check, publish and sign the image
    needs: [matrix, matrix-vm, node-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless: the workflow's OIDC identity
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/varek
      NODE: ghcr.io/${{ github.repository_owner }}/varek-node
      CHARTS: ghcr.io/${{ github.repository_owner }}/charts
      SETTINGS: >-
        --cap-drop ALL --cap-add SYS_ADMIN --cap-add SYS_PTRACE --cap-add SETPCAP
        --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add KILL
        --cap-add NET_ADMIN --cap-add NET_BIND_SERVICE --cap-add CHOWN
        --cgroupns=private --security-opt apparmor=varek-container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: The version, from the tag (a release tag, on main)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="${REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a release tag: $REF_NAME"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tag's commit is not on main: $GITHUB_SHA"; exit 1
          fi
          {
            echo "VERSION=$v"
            echo "RELEASE=${v%%-*}"
            echo "MINOR=$(echo "$v" | cut -d. -f1,2)"
            case "$v" in *-*) echo "PRERELEASE=1" ;; esac
          } >> "$GITHUB_ENV"
      - name: Load VAREK's AppArmor profile
        run: |
          sudo install -m 644 packaging/container/apparmor/varek-container /etc/apparmor.d/varek-container
          sudo apparmor_parser -r -W /etc/apparmor.d/varek-container
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: v2.6.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Build the runtime image
        run: |
          docker build -f packaging/container/Containerfile --target runtime \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --build-arg VAREK_VERSION="$VERSION" --build-arg VAREK_REVISION="$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" .
      - name: Check it before publishing - varek doctor finds every setting
        run: |
          # shellcheck disable=SC2086  # $SETTINGS: the docker flags, split into words
          docker run --rm $SETTINGS --entrypoint varek "$IMAGE:$VERSION" doctor | tee doctor.txt || true
          sed -n '/In a container/,/^$/p' doctor.txt > container.txt
          grep -q 'In a container' container.txt
          if grep -q 'FAIL' container.txt; then echo "varek doctor found a setting missing"; exit 1; fi
      - name: Check it before publishing - an agent runs under the baseline
        run: |
          mkdir -p proj && chmod 755 proj
          # shellcheck disable=SC2086  # $SETTINGS: the docker flags, split into words
          out="$(docker run --rm $SETTINGS -v "$PWD/proj:/work" "$IMAGE:$VERSION" /bin/echo ran-under-the-warden)"
          grep -qx ran-under-the-warden <<<"$out"
      - name: Check it before publishing - Docker's defaults are refused before the agent starts
        run: |
          if docker run --rm -v "$PWD/proj:/work" "$IMAGE:$VERSION" /bin/true 2> refused.txt; then
            echo "the run started under Docker's defaults"; exit 1
          fi
          grep -q 'this container cannot carry the run' refused.txt
      - name: Check it before publishing - the Warden is the tag's version
        run: |
          docker run --rm --entrypoint varek "$IMAGE:$VERSION" version > version.txt
          cat version.txt
          grep -qE "^VAREK Warden  ${RELEASE//./\\.}  " version.txt
      - name: Log in to the GitHub Container Registry (the workflow's own token)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Publish the version
        run: |
          docker push "$IMAGE:$VERSION"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "published $digest as $VERSION"
      - name: Sign the image (cosign, keyless)
        run: cosign sign --yes "$DIGEST"
      - name: The software bill of materials (CycloneDX), attached as a signed attestation
        run: |
          syft "$DIGEST" -o cyclonedx-json=sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$DIGEST"
      - name: Verify the signature and the attestation, as a user would
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          id="https://github.com/$REPO/.github/workflows/container-release.yml@$REF"
          iss=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$DIGEST" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$DIGEST" > /dev/null
          echo "verified: $DIGEST"
      - name: Build the node image (v1.34, the Helm chart's), amd64
        run: |
          docker build -f packaging/container/Containerfile --target node \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --build-arg VAREK_VERSION="$VERSION" --build-arg VAREK_REVISION="$GITHUB_SHA" \
            -t "$NODE:$VERSION-amd64" .
      - name: Check it before publishing - each command the chart names runs, the launcher static, the Warden the tag's version
        run: |
          packaging/container/node_check.sh "$NODE:$VERSION-amd64"
          docker run --rm "$NODE:$VERSION-amd64" varek version > node-version.txt
          grep -qE "^VAREK Warden  ${RELEASE//./\\.}  " node-version.txt
          [ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$NODE:$VERSION-amd64")" = linux/amd64 ]
      - name: Publish the node image for amd64 and arm64 (v1.36), sign it and attach each one's software bill of materials
        env:
          ARM64: ${{ needs.node-arm64.outputs.digest }}
        run: |
          docker push "$NODE:$VERSION-amd64"
          amd64="$(docker inspect --format '{{index .RepoDigests 0}}' "$NODE:$VERSION-amd64")"
          [[ "$ARM64" == "$NODE@sha256:"* ]] || { echo "node-arm64 gave no digest: $ARM64"; exit 1; }
          docker buildx imagetools create -t "$NODE:$VERSION" "$amd64" "$ARM64"
          # the image for both: exactly linux/amd64 and linux/arm64 (a build's
          # attestations, if any, are listed as unknown/unknown)
          docker buildx imagetools inspect --raw "$NODE:$VERSION" > node-index.json
          python3 packaging/container/platforms.py node-index.json linux/amd64 linux/arm64
          node="$NODE@$(docker buildx imagetools inspect "$NODE:$VERSION" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$node" == "$NODE@sha256:"* ]] || { echo "no digest for $NODE:$VERSION"; exit 1; }
          { echo "NODE_DIGEST=$node"; echo "NODE_AMD64=$amd64"; echo "NODE_ARM64=$ARM64"; } >> "$GITHUB_ENV"
          echo "published $node as $VERSION ($amd64, $ARM64)"
          # the image for both, and each architecture's (--recursive)
          cosign sign --yes --recursive "$node"
          for a in amd64 arm64; do
            d="$amd64"; [ "$a" = arm64 ] && d="$ARM64"
            syft "$d" --platform "linux/$a" -o "cyclonedx-json=sbom-node-$a.cdx.json"
            cosign attest --yes --type cyclonedx --predicate "sbom-node-$a.cdx.json" "$d"
          done
      - name: Install helm (pinned, built from source; its modules checked against Go's checksum database)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.18.6
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Package the chart, its image pinned by the digest just signed, and the CRDs' chart
        run: |
          for c in varek varek-crds; do
            for f in version appVersion; do
              v="$(helm show chart "packaging/helm/$c" | sed -n "s/^$f: //p" | tr -d '"')"
              [ "$v" = "$VERSION" ] || { echo "the $c chart's $f is $v, the tag's version $VERSION"; exit 1; }
            done
          done
          helm lint --strict packaging/helm/varek-crds
          helm package packaging/helm/varek-crds -d "$RUNNER_TEMP/chart"
          cp -r packaging/helm/varek "$RUNNER_TEMP/varek"
          d="${NODE_DIGEST#*@}"
          sed -i "s|^  digest: \"\"\$|  digest: \"$d\"|" "$RUNNER_TEMP/varek/values.yaml"
          grep -qx "  digest: \"$d\"" "$RUNNER_TEMP/varek/values.yaml"
          helm lint --strict "$RUNNER_TEMP/varek"
          helm template t "$RUNNER_TEMP/varek" --kube-version 1.31.0 > chart-render.yaml
          grep -q "image: $NODE@$d" chart-render.yaml
          helm package "$RUNNER_TEMP/varek" -d "$RUNNER_TEMP/chart"
      - name: Publish the chart and sign it
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/varek-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee chart-push.txt
          d="$(sed -n 's/^Digest: //p' chart-push.txt)"
          [ -n "$d" ] || { echo "helm push gave no digest"; exit 1; }
          echo "CHART_DIGEST=$CHARTS/varek@$d" >> "$GITHUB_ENV"
          cosign sign --yes "$CHARTS/varek@$d"
          # the CRDs' chart (Red Hat's chart certification: the varek chart holds none)
          helm push "$RUNNER_TEMP/chart/varek-crds-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee crds-push.txt
          d="$(sed -n 's/^Digest: //p' crds-push.txt)"
          [ -n "$d" ] || { echo "helm push gave no digest for varek-crds"; exit 1; }
          echo "CRDS_DIGEST=$CHARTS/varek-crds@$d" >> "$GITHUB_ENV"
          cosign sign --yes "$CHARTS/varek-crds@$d"
      - name: Verify the node image, its attestation and the chart, as a user would
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          id="https://github.com/$REPO/.github/workflows/container-release.yml@$REF"
          iss=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$NODE_DIGEST" > /dev/null
          for d in "$NODE_AMD64" "$NODE_ARM64"; do
            cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$d" > /dev/null
            cosign verify-attestation --type cyclonedx --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$d" > /dev/null
          done
          cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$CHART_DIGEST" > /dev/null
          cosign verify --certificate-identity "$id" --certificate-oidc-issuer "$iss" "$CRDS_DIGEST" > /dev/null
          echo "verified: $NODE_DIGEST ($NODE_AMD64, $NODE_ARM64) $CHART_DIGEST $CRDS_DIGEST"
      - name: Move the major.minor tag and latest, once signed (not for a pre-release)
        if: env.PRERELEASE == ''
        run: |
          rels="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          tags=()
          [ "$(grep -F "v$MINOR." <<<"$rels" | tail -1)" = "v$VERSION" ] && tags+=("$MINOR")
          [ "$(tail -1 <<<"$rels")" = "v$VERSION" ] && tags+=(latest)
          for t in "${tags[@]}"; do
            docker tag "$IMAGE:$VERSION" "$IMAGE:$t"
            docker push "$IMAGE:$t"
            # the node image for both architectures, moved in the registry
            docker buildx imagetools create -t "$NODE:$t" "$NODE_DIGEST"
          done
          echo "moved: ${tags[*]:-none} (a newer release holds the rest)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ env.VERSION }}
          path: |
            sbom.cdx.json
            sbom-node-amd64.cdx.json
            sbom-node-arm64.cdx.json
