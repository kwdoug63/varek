# SPDX-License-Identifier: MIT
#
# VAREK's chart (v1.34, docs/security/v1.34-kubernetes.md, section 3). Install
# it into a namespace of its own that admits privileged pods (the node agent
# is privileged on the node, as Falco or Tetragon are):
#
#   kubectl create namespace varek-system
#   kubectl label namespace varek-system pod-security.kubernetes.io/enforce=privileged
#   helm install varek oci://ghcr.io/kwdoug63/charts/varek -n varek-system
#
# A pod is then supervised when it names a VarekPolicy of its namespace with
# the annotation varek.dev/policy: NAME.

image:
  repository: ghcr.io/kwdoug63/varek-node
  # default: the chart's appVersion
  tag: ""
  # a digest (sha256:...) pins the image whatever its tag points at, and is
  # what to give in production
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The node's container runtime, which must let an NRI plugin set a
# container's seccomp policy and command (NRI v0.10): containerd 2.2 or later
# (EKS, kind), or CRI-O 1.35 or later (OpenShift). An earlier one is refused
# by the plugin, which says so in its log.
runtime: containerd        # containerd or cri-o

nri:
  # the runtime's NRI socket (both runtimes' default)
  socket: /var/run/nri/nri.sock
  # the runtime handlers whose containers run the Warden's filter (its
  # seccomp listener); a supervised pod of another (Kata, gVisor) is refused
  runtimeHandlers: [runc, crun]

# Where things are on each node (hostPath). The node agent refuses a
# policies' directory others can write and a socket directory others can
# reach; the chart's init container makes them so.
node:
  policies: /var/lib/varek/policies     # POLICY_DIR/<namespace>/<name>.policy (the plugin's -sync)
  streams: /var/log/varek               # the evidence: one stream a container, with its policy
  socket: /run/varek-node               # the node agent's listener (the filters' listenerPath)
  bin: /opt/varek/bin                   # the launcher the plugin binds at /varek/init
  control: /run/varek                   # each run's control socket (varek revoke, on the node)
  exportState: /var/lib/varek/export    # the exporter's record of the streams it has exported
  # the kubelet's seccomp root: VAREK's unsupervised profile is put at
  # varek/unsupervised.json under it, which each container of a supervised
  # pod names (seccompProfile: {type: Localhost, localhostProfile:
  # varek/unsupervised.json}); every call refused until the plugin replaces it
  seccompRoot: /var/lib/kubelet/seccomp
  # the DNS server (a.b.c.d[:port]) the node agent resolves the policies'
  # host names through: "" the cluster's DNS service (kube-system/kube-dns,
  # or OpenShift's openshift-dns/dns-default), looked up at install; "none"
  # the one the pod's resolv.conf names (the webhook keeps a pod to the
  # cluster's DNS)
  dnsServer: ""
  # v1.36 step 6 (D5): the kubelet's root, whose pods/ directory the node
  # agent reads a pod's user's token from (read-only), the copy the kubelet
  # keeps of the pod's varek-obo volume
  kubelet: /var/lib/kubelet
  # the runtime's state, where each container's bundle is (read-only)
  state:
    containerd: /run/containerd
    cri-o: /run/containers

# D8: each container's stream signed with the node's key. v1.36 step 9
# (D10): each node agent makes its own key at its first start (nodeKey) and
# keeps it on the node; the NRI plugin publishes its public key as the
# node's VarekNodeKey, which the admission webhook admits only from that
# node. Audit a stream with the cluster's list: varek_audit.py --node-keys
# (kubectl get vareknodekeys -o json). secretName instead signs every node's
# streams with one key, a Secret holding `key` (tools/varek_keygen's private
# key) and `key.pub` (v1.34 D8); with neither, nothing is signed
signing:
  secretName: ""
  nodeKey:
    enabled: true
    # the key, root's, 0400, in a directory only the node agent mounts
    dir: /var/lib/varek/key
    # its public key, which the plugin and the exporter read
    pubDir: /var/lib/varek/key-pub
  # a checkpoint every this many records (the Warden's --checkpoint-every)
  checkpointEvery: 256

# D8: each run's checkpoints appended to the node's anchor, a file in the
# streams' directory (forward it with tools/varek_anchor_forward.py)
anchor:
  enabled: false
  file: anchor

# v1.36 step 4 (docs/security/v1.36-kubernetes-parity.md, D1, D2): credentials.
# A policy names a credential (credential NAME from SOURCE); a cluster
# administrator gives it, from that source, to the namespaces whose policies
# may name it, with a VarekCredential (cluster-scoped). The node agent fetches
# each value with warden-secrets on the node, under the DaemonSet's identity,
# and hands it to the proxy in the pod's network; the agent's pod holds only
# a placeholder (VAREK_CRED_<NAME>), which the NRI plugin sets.
credentials:
  # where a file: source is: each Secret named below (of this release's
  # namespace) is mounted at DIR/<secret>/<key>, root's, 0400
  dir: /var/lib/varek/credentials
  secrets: []
  # vault: sources
  vault:
    addr: ""              # https://vault.example.com:8200
    caSecret: ""          # a Secret of this namespace with ca.crt to verify Vault with (else the image's trust store)
    # Vault's Kubernetes auth: the node agent's service account's token, which
    # the kubelet projects (this audience), logs in as this role
    kubernetesAuth:
      role: ""
      mount: kubernetes
      audience: vault
  # aws-sm: sources
  aws:
    region: ""            # else the secret ARN's
    # IRSA: this role, assumed with a token the kubelet projects (audience
    # sts.amazonaws.com) for the node agent's service account
    roleArn: ""
    # or EKS Pod Identity: the role associated with the node agent's service
    # account, from the node's Pod Identity agent (audience pods.eks.amazonaws.com)
    podIdentity: false
    # neither: the node's instance role (IMDSv2)

# D8: the streams exported as OCSF to the DaemonSet's log, which the
# cluster's log collector takes (tools/varek_node_export.py)
exporter:
  enabled: true
  # streams followed at once (each a process); the others wait their turn
  maxFollowers: 64
  # each stream is audited whole when its run ends (tools/varek_audit.py),
  # about 3.7 KB a record (measured, v1.34 step 9: 202,857 records, 748 MB,
  # 110 s): a pod's day of an agent's work, some 440,000 records, about
  # 1.6 GB. A run whose audit does not fit is reported not verified, never
  # verified.
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 2Gi }

# v1.36 step 6 (docs/security/v1.36-kubernetes-parity.md, D5): a pod acting
# for a user names the Secret its user's token is in (key token) with the
# annotation varek.dev/on-behalf-of: SECRET; its policy trusts the token's
# issuer (trust issuer URL audience AUD) and may say `require
# on-behalf-of`. The webhook gives the pod a Secret volume of it (varek-obo)
# and an init container that alone mounts it (the node image, /bin/true);
# the node agent reads the token from the kubelet's copy, by the pod's uid,
# and verifies it as the Warden does on a host (--on-behalf-of). No
# container of the agent's can read it.
onBehalfOf:
  # the init container's user and group; on OpenShift, the namespace's
  # (restricted-v2 gives it) whatever is set here
  user: 65534
  # a ConfigMap of this release's namespace whose ca.crt verifies the
  # issuers' TLS (their discovery documents and keys): kube-root-ca.crt for
  # the cluster's own service account issuer; "" the image's trust store
  issuerCaConfigMap: ""

# v1.36 step 6 (D5): the agent's SVID, from the node's SPIRE agent through
# its Delegated Identity API (varek-svid, by the container's process id),
# for a policy that trusts a SPIFFE trust domain (trust spiffe DOMAIN bundle
# FILE). The SPIRE agent's configuration names the node agent's SPIFFE ID
# among its authorized_delegates; "" asks for no SVID.
spire:
  # the SPIRE agent's admin socket on the node (admin_socket_path), e.g.
  # /run/spire/admin-sockets/admin.sock: its directory is mounted
  adminSocket: ""
  # the node agent's own SPIFFE ID, left out of a pod's SVIDs (an entry
  # selected by the DaemonSet's uid alone matches the pods' processes too)
  self: ""
  # a ConfigMap of this release's namespace holding the trust domain's
  # bundle (SPIRE's k8sbundle notifier can write one), mounted at
  # /etc/varek/spire-bundle: the policy says trust spiffe DOMAIN bundle
  # /etc/varek/spire-bundle/KEY
  bundleConfigMap: ""

# v1.36 step 7 (D7b): a VarekPolicy's flow policy (spec.flowPolicy) gates
# the pod's plan with a refusal breaker whose table is kept on each node,
# here (a host path, root's): the budgets bound each node, not the cluster.
# A pod's session is its namespace and service account.
flowPolicy:
  stateDir: /var/lib/varek/flow

# v1.36 step 8 (D9): a container's stream, past this many bytes, goes on in
# a new segment beside it (<container>.<supervisor>.jsonl.2, .3, ...), each
# beginning with a checkpoint that names it and carries the hash chain on
# from the one before; the exporter follows them in turn, and the audit
# takes them in order (varek_audit.py ... NAME.jsonl NAME.jsonl.2 ...).
# 65536 or more; 0, no rotation.
streams:
  rotateBytes: 268435456                # 256 MiB

# v1.36 step 7 (D7): the trust bundles a VarekPolicy names (spec.trustBundle:
# a key), in a ConfigMap of this release's namespace, mounted projected at
# /etc/varek/trust-bundles; "" a pod's inspecting mode trusts the node
# image's roots
trustBundles:
  configMap: ""

nodeAgent:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 1Gi }
  # extra arguments to the node agent (the Warden's options: --dns-server ...)
  extraArgs: []

plugin:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 256Mi }

# the release builds the node image for amd64 and arm64 (one image, both
# architectures): Linux nodes of either. A supervised pod placed on a node
# without the agent does not run (no plugin there to replace its
# unsupervised profile)
nodeSelector:
  kubernetes.io/os: linux
# every node runs it, tainted ones too: a supervised pod placed on a node
# without it does not run
tolerations:
  - operator: Exists
priorityClassName: system-node-critical

# D7: the admission webhook
admission:
  replicas: 2
  # failurePolicy Fail: while the webhook is down, the pods and policies it
  # checks are refused, not let in
  failurePolicy: Fail
  timeoutSeconds: 15
  # namespaces whose pods are not checked (the chart's own is always one)
  excludeNamespaces: [kube-system]
  # RuntimeClass names a supervised pod may give: ones whose handler is in
  # nri.runtimeHandlers (a pod giving none is taken)
  runtimeClasses: []
  # the webhook's certificate: the chart makes a CA and a certificate and
  # keeps them across upgrades; or name a kubernetes.io/tls Secret with
  # ca.crt, or use cert-manager (an Issuer or ClusterIssuer of yours)
  tls:
    secretName: ""
    # with secretName: the CA that signed its certificate (base64 PEM), when
    # the Secret holds no ca.crt
    caBundle: ""
    certManager:
      enabled: false
      issuerKind: Issuer
      issuerName: ""
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 256Mi }

# OpenShift: a SecurityContextConstraints for the node agent's service
# account (privileged, the node's PID namespace, host paths; the plugin,
# the exporter and the init container as spc_t, the launcher labelled for
# containers), and one for supervised pods (RELEASE-supervised:
# restricted-v2 with VAREK's unsupervised profile admitted), given to a
# namespace's service accounts by binding the ClusterRole
# RELEASE-supervised-scc
openshift:
  enabled: false
