{{/* SPDX-License-Identifier: MIT
  v1.36 step 4 (docs/security/v1.36-kubernetes-parity.md, D1): warden-secrets'
  configuration, for the vault: and aws-sm: sources, as the node agent
  reads it (root's, 0400, /etc/varek/secrets/secrets.conf). Each store is
  reached from the node under the DaemonSet's own identity: Vault's
  Kubernetes auth with a token the kubelet projects for the node agent's
  service account; AWS through IRSA or EKS Pod Identity, each with its own
  projected token, or the node's instance role. No token or key is in it. */}}
{{- if include "varek.secretsConf" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "varek.nodeName" . }}-secrets-conf
  namespace: {{ .Release.Namespace }}
  labels: {{- include "varek.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.conf: |
    # warden-secrets' configuration (varek/v1_4/warden_secrets_helper.c), from the chart's credentials values
{{ include "varek.secretsConf" . | indent 4 }}
{{- end }}
