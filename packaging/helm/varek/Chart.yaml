# SPDX-License-Identifier: MIT
apiVersion: v2
name: varek
description: >-
  VAREK on Kubernetes: the Warden's node agent, NRI plugin and launcher on
  each node (a DaemonSet), the VarekPolicy resource and its admission webhook.
  Every call of the containers of a pod that names a policy (the annotation
  varek.dev/policy) is decided by the Warden under that policy.
type: application
version: 1.34.0
appVersion: "1.34.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/kwdoug63/varek
sources:
  - https://github.com/kwdoug63/varek
keywords: [security, seccomp, agents, policy, nri]
annotations:
  # docs/security/v1.34-kubernetes.md, section 3 and the implementation plan's step 6
  varek.dev/design: docs/security/v1.34-kubernetes.md
