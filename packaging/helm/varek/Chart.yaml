# SPDX-License-Identifier: MIT
apiVersion: v2
name: varek
description: >-
  VAREK on Kubernetes: the Warden's node agent, NRI plugin and launcher on
  each node (a DaemonSet), the VarekPolicy resource and its admission webhook.
  Each container of a pod that names a policy (the annotation
  varek.dev/policy) runs with the Warden deciding its calls under that policy,
  or does not run.
type: application
version: 1.36.1
appVersion: "1.36.1"
kubeVersion: ">=1.30.0-0"
home: https://github.com/kwdoug63/varek
sources:
  - https://github.com/kwdoug63/varek
keywords: [security, seccomp, agents, policy, nri]
annotations:
  # docs/security/v1.34-kubernetes.md, section 3 and the implementation plan's step 6
  varek.dev/design: docs/security/v1.34-kubernetes.md
  # Red Hat's chart certification (chart-verifier, partner profile): the
  # chart's name in OpenShift's console, its provider, and the architectures
  # its node image is built for
  charts.openshift.io/name: VAREK
  charts.openshift.io/provider: Sober Agentic Infrastructure, Inc.
  charts.openshift.io/supportURL: https://github.com/kwdoug63/varek/blob/main/SECURITY.md
  charts.openshift.io/archs: x86_64,aarch64
