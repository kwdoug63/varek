# SPDX-License-Identifier: MIT
#
# v1.34 step 5 (docs/security/v1.34-kubernetes.md, D7): VAREK's policies as
# a namespaced resource. Its text is the policy as written for the Warden; a
# pod names one of its namespace's by the annotation varek.dev/policy: NAME.
# VAREK's NRI plugin (varek-nri -sync) writes each to its node's policy
# directory, as POLICY_DIR/<namespace>/<name>.policy; the admission webhook
# (varek-admission) refuses one the Warden does not load or the node agent
# does not carry. v1.36 step 7 (docs/security/v1.36-kubernetes-parity.md, D6,
# D7, D7b): beside the policy, a dry run, a trust bundle (a key of the
# chart's trustBundles.configMap) and a flow policy, which the plugin writes
# beside the policy and the node agent takes as a host's Warden takes
# --dry-run, --trust-bundle and --flow-policy.
# The varek-crds chart installs it (Red Hat's chart certification refuses a
# chart with CRDs, so they are a chart of their own, installed before the
# varek chart); helm upgrade varek-crds changes it, and its
# helm.sh/resource-policy keeps it, and every resource of its kind, on an
# uninstall.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: varek
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  name: varekpolicies.varek.dev
spec:
  group: varek.dev
  scope: Namespaced
  names:
    plural: varekpolicies
    singular: varekpolicy
    kind: VarekPolicy
    shortNames: [vp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          # the node agent takes a name of 1 to 63 of a-z, 0-9 and - only
          x-kubernetes-validations:
            - rule: "self.metadata.name.matches('^[a-z0-9-]{1,63}$')"
              message: "a VarekPolicy's name is 1 to 63 of a-z, 0-9 and -"
          properties:
            spec:
              type: object
              required: [policy]
              properties:
                policy:
                  description: The policy, as written for the Warden (varek/v1_4/policy.txt is one).
                  type: string
                  minLength: 1
                  maxLength: 1048576
                dryRun:
                  description: >-
                    A dry run (the Warden's --dry-run): every call is decided and recorded, and one the
                    policy refuses is let through, except a connect, which in a pod would reach the
                    cluster's network (D6). For varek policy suggest; not with credentials, sub-agents,
                    a plan or a flow policy.
                  type: boolean
                trustBundle:
                  description: >-
                    The roots inspecting mode trusts in place of the node image's (--trust-bundle): a
                    key of the ConfigMap the chart's trustBundles.configMap names.
                  type: string
                  pattern: '^[-._a-zA-Z0-9]{1,253}$'
                flowPolicy:
                  description: >-
                    A flow policy (the Warden's --flow-policy file), with its refusal breaker kept on
                    each node; a pod under it names its plan, and its session is the pod's namespace
                    and service account.
                  type: string
                  maxLength: 1048576
