# SPDX-License-Identifier: MIT
#
# v1.36 step 4 (docs/security/v1.36-kubernetes-parity.md, D2): a credential
# given to namespaces, cluster-scoped. A policy names a credential
# (`credential NAME from SOURCE`); its pod runs only where a VarekCredential
# gives NAME, from that SOURCE, to the pod's namespace. A cluster
# administrator writes these, through the cluster's own review (as
# policies: v1.34 D7). VAREK's NRI plugin (varek-nri -sync) writes the
# cluster's as one list on each node (POLICY_DIR/.credentials), which the node
# agent checks at each container's start; the admission webhook
# (varek-admission) checks each VarekCredential, and each policy and pod
# against them. The value itself is fetched on the node by warden-secrets,
# under the DaemonSet's identity, and never enters the agent's pod.
# The varek-crds chart installs it (Red Hat's chart certification refuses a
# chart with CRDs, so they are a chart of their own, installed before the
# varek chart); helm upgrade varek-crds changes it, and its
# helm.sh/resource-policy keeps it, and every resource of its kind, on an
# uninstall.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: varek
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  name: varekcredentials.varek.dev
spec:
  group: varek.dev
  scope: Cluster
  names:
    plural: varekcredentials
    singular: varekcredential
    kind: VarekCredential
    shortNames: [vcr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Credential
          type: string
          jsonPath: .spec.credential
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Namespaces
          type: string
          jsonPath: .spec.namespaces
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [credential, source, namespaces]
              properties:
                credential:
                  description: The credential's name, as a policy names it (credential NAME from ...).
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,31}$'
                source:
                  description: >-
                    Where its value is, as the policy writes it: file:PATH (a file of a Secret the chart
                    mounts under credentials.dir), vault:PATH#FIELD or aws-sm:ARN.
                  type: string
                  pattern: '^(file|vault|aws-sm):[!-~]+$'
                  maxLength: 1031
                namespaces:
                  description: The namespaces whose policies may name it.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: '^[a-z0-9-]{1,63}$'
